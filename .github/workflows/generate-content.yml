name: Generate Renter Article

on:
  schedule:
    # Run daily at 8:33 AM UTC (3:33 AM EST) - off-peak time
    - cron: '33 8 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for proper git operations

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON files
        run: npm run validate

      - name: Generate new renter article
        id: generate
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: npm run generate

      - name: Fix formatting inconsistencies
        run: |
          npm run fix-formatting
          node scripts/fix-horizontal-rules.js

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- _guides/ generated-topics.json generation-failures.json assets/images/guides/)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate series navigation (informational)
        if: steps.git-check.outputs.changes == 'true'
        continue-on-error: true
        run: npm run validate:series

      - name: Commit and push new renter article
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _guides/ generated-topics.json generation-failures.json assets/images/guides/
          git commit -m "Add new renter article with FLUX image [automated] - formatting verified"
          git push

      - name: Add generation issues to workflow summary
        if: always()
        run: |
          node -e 'const fs=require("fs"); const file="generation-failures.json"; const failures=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,"utf8")):[]; if(failures.length){fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Article generation issues\n\n${failures.map(f=>`- **${f.title}**: ${f.error}`).join("\n")}\n`)}'

      - name: Fail workflow after recording generation issues
        if: steps.generate.outcome == 'failure'
        run: |
          echo "Article generation failed. Review generation-failures.json and the Generate new renter article log."
          exit 1
